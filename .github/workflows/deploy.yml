name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/teetimepro
            git fetch origin main
            git reset --hard origin/main
            
            # Build with env file for variable interpolation
            docker compose --env-file .env.prod build api sidekiq
            
            # Remove orphaned containers and bring up infrastructure first
            docker compose --env-file .env.prod up -d --remove-orphans db redis
            sleep 5
            
            # Bring up application services
            docker compose --env-file .env.prod up -d api sidekiq voice-agent
            sleep 20
            
            # Wait for API to be healthy (up to 60s)
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3007/health > /dev/null 2>&1; then
                echo "✅ Deploy successful - API healthy"
                
                # Now bring up web frontend
                docker compose --env-file .env.prod up -d web
                exit 0
              fi
              echo "Waiting for API... ($i/12)"
              sleep 5
            done
            
            echo "❌ Deploy failed - API unhealthy after 60s"
            docker compose --env-file .env.prod logs api --tail 30
            exit 1
