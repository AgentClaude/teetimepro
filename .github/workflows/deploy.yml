name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/teetimepro
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build api sidekiq web
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d db redis
            sleep 5
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api sidekiq web voice-agent
            sleep 15
            # Health check via the mapped port
            if curl -sf http://localhost:3007/health > /dev/null; then
              echo "✅ Deploy successful - API healthy"
            else
              echo "❌ Deploy failed - API unhealthy"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs api --tail 20
              exit 1
            fi
