name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # Only deploy if CI passes
  ci-check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci-check
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip deploy]')"
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/teetimepro

            echo "📦 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "🔨 Building images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build api sidekiq web

            echo "🚀 Rolling restart..."
            # Restart API first
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps api

            # Wait for the container healthcheck, which probes the API from inside the
            # container. In production the API is not published on host port 3000.
            echo "⏳ Waiting for API health check..."
            for i in $(seq 1 30); do
              health_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' teetimepro_api)
              if [ "$health_status" = "healthy" ]; then
                break
              fi

              echo "API health status: $health_status ($i/30)"
              sleep 10
            done

            if [ "$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' teetimepro_api)" = "healthy" ]; then
              echo "✅ API healthy"
            else
              echo "❌ API unhealthy"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T api curl -sS http://localhost:3000/health || true
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs api --tail 30
              exit 1
            fi

            # Restart remaining services
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps sidekiq web nginx

            echo "🧹 Pruning old images..."
            docker image prune -f --filter "until=168h"

            echo "✅ Deploy complete"
